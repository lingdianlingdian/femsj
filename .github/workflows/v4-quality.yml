name: V4 Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  data-quality:
    name: Data / Evidence / Content Audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: CSV structural audit
        run: npm run audit:data

      - name: Evidence persistence audit
        run: npm run audit:evidence

      - name: Verify P0 research closure report
        run: npm run research:closure:check

      - name: Content reference closure audit
        run: npm run audit:content

      - name: Art production contract audit
        run: npm run audit:art

      - name: Binary art file audit
        run: npm run audit:art:files

      - name: Full runtime art binding audit
        run: npm run audit:art:runtime-full

      - name: Art next-job gate smoke
        run: npm run art:next -- 20

      - name: Runtime readiness report
        run: npm run audit:runtime

      - name: Validate full 110-day runtime
        run: npm run validate:config -- production-data/v4/runtime/game_content_day001_110.json

      - name: Verify full runtime is fresh
        run: npm run runtime:check:full

      - name: Verify full runtime closure report
        shell: bash
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('production-data/v4/runtime/game_content_day001_110_report.json','utf8'));
          const errors=[];
          if(r.counts.orders!==651) errors.push('orders='+r.counts.orders);
          if(r.counts.days!==110) errors.push('days='+r.counts.days);
          if(r.counts.buildNodes!==48) errors.push('buildNodes='+r.counts.buildNodes);
          if(r.counts.items!==143) errors.push('items='+r.counts.items);
          if(r.closure.referenceErrors!==0) errors.push('referenceErrors='+r.closure.referenceErrors);
          if(r.closure.missingItemAssets!==0) errors.push('missingItemAssets='+r.closure.missingItemAssets);
          if(!r.closure.orderRegistryMatch) errors.push('orderRegistryMatch=false');
          if(!r.closure.dayCoverage) errors.push('dayCoverage=false');
          if(!r.closure.storyHookCoverage) errors.push('storyHookCoverage=false');
          if(!r.closure.buildCoverage) errors.push('buildCoverage=false');
          console.log(JSON.stringify({counts:r.counts,closure:r.closure,economy:r.economy,errors},null,2));
          process.exit(errors.length?1:0);
          NODE

      - name: Full runtime balance smoke Day 30
        run: npm run simulate:balance -- production-data/v4/runtime/game_content_day001_110.json 30 200 20260925

      - name: Full runtime balance smoke Day 60
        run: npm run simulate:balance -- production-data/v4/runtime/game_content_day001_110.json 60 200 20260925

      - name: Full runtime balance smoke Day 90
        run: npm run simulate:balance -- production-data/v4/runtime/game_content_day001_110.json 90 200 20260925

      - name: Full runtime balance smoke Day 110
        run: npm run simulate:balance -- production-data/v4/runtime/game_content_day001_110.json 110 200 20260925

      - name: Full runtime balance trend gate
        run: npm run gate:balance:full

      - name: Full 110-day balance reachability gate
        run: npm run gate:balance:full-reachability

      - name: Validate Day1-10 runtime slice
        run: npm run validate:config -- production-data/v4/runtime/game_content_day001_010.json

      - name: Balance smoke Day 1
        run: npm run simulate:balance -- production-data/v4/runtime/game_content_day001_010.json 1 500 20260925

      - name: Balance smoke Day 5
        run: npm run simulate:balance -- production-data/v4/runtime/game_content_day001_010.json 5 500 20260925

      - name: Balance smoke Day 10
        run: npm run simulate:balance -- production-data/v4/runtime/game_content_day001_010.json 10 500 20260925

      - name: Vertical slice balance gate
        run: npm run gate:balance:vertical

      - name: Board-state smoke Day 1
        run: npm run simulate:balance:v3 -- production-data/v4/runtime/game_content_day001_010.json 1 300 20260925 OPTIMIZED

      - name: Board-state smoke Day 10
        run: npm run simulate:balance:v3 -- production-data/v4/runtime/game_content_day001_010.json 10 300 20260925 OPTIMIZED

      - name: Board-state balance gate
        run: npm run gate:balance:v3

      - name: Validate Day1-10 story references
        run: npm run validate:story

      - name: Validate Day11-20 story references
        run: npm run validate:story:day11-20

      - name: Validate all story slices
        run: npm run validate:story:all

      - name: Validate character canon and street layout
        run: npm run validate:character-canon

      - name: Verify Cocos UI contracts
        run: npm run cocos:contracts:check

      - name: Verify Cocos runtime/story/art resources
        run: npm run cocos:resources:check

      - name: Verify Cocos runtime/story resources
        run: npm run cocos:resources:check

      - name: Vertical economy source-sink gate
        run: npm run gate:economy:vertical

      - name: Parse critical JSON files
        shell: bash
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const files = [
            'production-data/v4/levels/order_registry_110.json',
            'production-data/v4/levels/order_requirements_verified.json',
            'production-data/v4/content/transform_graph_verified_v4.json',
            'production-data/v4/ui/screens_v4.json',
            'production-data/v4/ui/components_v4.json',
            'production-data/v4/build/street_layout_4areas.json',
            'production-data/v4/characters/character_canon_v4.json',
            'production-data/v4/audio/audio_manifest_v4.json',
            'production-data/v4/art/ai_art_jobs_v4.json',
            'production-data/v4/art/ai_art_batch_s1_s3_v4.json',
            'production-data/v4/art/art_output_manifest_v4.json',
            'production-data/v4/art/render_waves_day001_010_v4.json',
            'production-data/v4/art/day001_010_art_coverage_v4.json',
            'schemas/v4/art_output_manifest.schema.json',
            'schemas/v4/style_anchor_output_manifest.schema.json',
            'production-data/v4/art/style_anchor_outputs_v4.json',
            'schemas/v4/runtime_art_bindings.schema.json',
            'production-data/v4/art/w0_style_lock_review_v4.json',
            'production-data/v4/art/runtime_art_bindings_day001_010_v4.json',
            'production-data/v4/art/runtime_art_bindings_day001_110_v4.json',
            'production-data/v4/events/events_v4.json',
            'production-data/v4/runtime/game_content_day001_010.json',
            'production-data/v4/story/story_catalog_v4.json',
            'production-data/v4/runtime/game_content_day001_110_report.json',
            'production-data/v4/runtime/full_runtime_balance_targets.json',
            'production-data/v4/runtime/game_content_day001_110.json',
            'production-data/v4/runtime/vertical_slice_balance_targets.json',
            'production-data/v4/runtime/vertical_slice_board_targets.json',
            'production-data/v4/runtime/vertical_slice_economy_targets.json',
            'production-data/v4/story/story_dialogue_day001_010.json',
            'production-data/v4/story/locale_zh-CN_day001_010.json',
            'production-data/v4/story/story_dialogue_day011_020.json',
            'production-data/v4/story/locale_zh-CN_day011_020.json',
            'production-data/v4/story/locale_zh-CN_day031_040.json',
            'production-data/v4/story/story_dialogue_day031_040.json',
            'production-data/v4/story/locale_zh-CN_day021_030.json',
            'production-data/v4/story/story_dialogue_day021_030.json',
            'schemas/v4/story_script.schema.json',
            'research-data/evidence/source_registry_v4.json',
            'research-data/levels/public_image_assets_v4.json',
            'research-data/economy/observation_ledger_v4.json'
          ];
          let failed = false;
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log('PASS', file);
            } catch (e) {
              failed = true;
              console.error('FAIL', file, e.message);
            }
          }
          process.exit(failed ? 1 : 0);
          NODE

      - name: Verify verified-level slice invariants
        run: |
          node - <<'NODE'
          import fs from 'node:fs';
          const req = JSON.parse(fs.readFileSync('production-data/v4/levels/order_requirements_verified.json','utf8'));
          const slice = JSON.parse(fs.readFileSync('production-data/v4/levels/verified_level_slice_v4.json','utf8'));
          const errors = [];
          if (req.unresolvedCount !== 0) errors.push('Verified requirements contain unresolved item IDs');
          if (req.rows.length !== slice.orderCount) errors.push(`Order count mismatch: requirements=${req.rows.length}, slice=${slice.orderCount}`);
          const ids = req.rows.map(x => x.orderId);
          if (new Set(ids).size !== ids.length) errors.push('Duplicate verified orderId');
          const days = new Set(req.rows.map(x => x.day));
          if (days.size !== slice.dayCount) errors.push(`Day count mismatch: requirements=${days.size}, slice=${slice.dayCount}`);
          console.log(JSON.stringify({orders:req.rows.length, days:days.size, errors}, null, 2));
          process.exit(errors.length ? 1 : 0);
          NODE

  contract-smoke:
    name: Contract Smoke Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check required production files
        shell: bash
        run: |
          required=(
            AGENTS.md
            api/openapi-v4.yaml
            schemas/v4/game_content.schema.json
            schemas/v4/remote_config.schema.json
            qa/v4/test_cases_v4.json
            docs/production/V4/STATUS.md
            production-data/v4/runtime/game_content_day001_110.json
            production-data/v4/runtime/game_content_day001_110_report.json
            production-data/v4/story/story_catalog_v4.json
            production-data/v4/art/runtime_art_bindings_day001_110_v4.json
            prototype/v4-ui-wireframes/index.html
            prototype/v4-ui-kit/index.html
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
            echo "PASS $f"
          done
